name: Stock
options:
  bundleIdPrefix: dev.cardozo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    CODE_SIGN_STYLE: Automatic
    # Cristian's free personal team, the same one Gastos Diarios uses. Baked in
    # so xcodegen persists it and Xcode stops rewriting the generated project on
    # every open. Free team = 7-day signing, which is the $0 distribution path
    # until the Apple Developer Program decision (PLAN Phase 5).
    DEVELOPMENT_TEAM: FA737M2U79

packages:
  # 12.x verified against the emulator on 2026-09-03, because the Gastos
  # Diarios session had to revert this exact bump: on 12.18.0 its Servicios and
  # Tarjetas screens hung on "Cargando…" and the emulator answered GOAWAY
  # ENHANCE_YOUR_CALM / too_many_pings.
  #
  # Stock is not exposed, and the reason is architectural rather than luck: all
  # six of its listeners live in one long-lived `Store` and are opened once at
  # sign-in. Gastos opens and releases additional streams per screen, and it is
  # that CHURN the keepalive policy objects to, not the count — Stock runs more
  # concurrent listeners than it does.
  #
  # What was checked: all four tabs render server data (the Hoy tab exercises
  # the plan listener), four gRPC connections stay ESTABLISHED across several
  # minutes, and firebase-debug.log — which demonstrably records listener
  # activity — carries no GOAWAY. Auth was proven server-side rather than from
  # the screen: the emulator's lastLoginAt for the seeded user lands two seconds
  # AFTER the app launched, so it is not a stale keychain session.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

targets:
  Stock:
    type: application
    platform: iOS
    sources:
      - path: Stock
      # The seed data the web writes too. XcodeGen puts resources in `sources`
      # with an explicit buildPhase; a folder reference would nest them under
      # shared/ inside the bundle, where Bundle.url(forResource:) can't see them.
      - path: ../../shared/categories.json
        buildPhase: resources
      - path: ../../shared/locations.json
        buildPhase: resources
      - path: ../../shared/units.json
        buildPhase: resources
    info:
      path: Stock/Info.plist
      properties:
        CFBundleDisplayName: Stock
        CFBundleShortVersionString: '0.1'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Same face as the web, so the two apps read as one family.
        UIAppFonts:
          - Outfit-Variable.ttf
        # The scanner is the only hardware this app asks for, and the string
        # says what it does with it.
        NSCameraUsageDescription: Para escanear el código de barras de un producto y cargarlo sin tipear.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleURLSchemes:
              - stock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.stock
        MARKETING_VERSION: '0.1'
        SWIFT_VERSION: '5.10'
        # The bag mark from the design bundle, in the three appearances iOS 18
        # asks for: light, dark, and the tinted monochrome the system recolours.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Must match REVERSED_CLIENT_ID in GoogleService-Info.plist: it is the
        # URL scheme Google calls back on, and a mismatch means the sign-in
        # leaves and never returns.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.176221729478-irdlooa4ls67ocn58vm5o0crvmkdtu2p
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      # Embeds the watch app so it installs alongside the phone app.
      - target: StockWatch
        embed: true

  # watchOS companion — the shopping list on the wrist, which is the one place
  # the phone is genuinely in the way: both hands are on the trolley.
  #
  # It CANNOT sign in (Google needs a browser and a watch has none), so it never
  # talks to Firebase. The phone pushes a flattened snapshot over
  # WatchConnectivity and performs every write. No Firebase dependency here on
  # purpose — see Stock/Data/WatchSync.swift.
  StockWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - path: StockWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.stock.watchkitapp
        PRODUCT_NAME: StockWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: 'YES'
        GENERATE_INFOPLIST_FILE: 'NO'
        SWIFT_VERSION: '5.10'
    info:
      path: StockWatch/Info.plist
      properties:
        CFBundleDisplayName: Stock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # Ties the two together: this is what makes the watch app install with
        # the phone app instead of as a stranger.
        WKCompanionAppBundleIdentifier: dev.cardozo.stock

  # Domain tests compile the pure-logic files directly instead of depending on
  # the app target: the shared vectors don't need Firebase, and making them wait
  # for an SDK download to prove that calendar arithmetic works would be silly.
  StockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StockTests
      - path: Stock/Domain
      # Pure Foundation despite living in Data/ — no Firebase, so the tests can
      # compile it without waiting for an SDK.
      - path: Stock/Data/SigningExpiry.swift
      # SwiftUI and UIKit only. Compiled in so the symbol map can be checked
      # against what SF Symbols actually ships.
      - path: Stock/Design/Theme.swift
      - path: ../../shared/categories.json
        buildPhase: resources
      - path: ../../shared/locations.json
        buildPhase: resources
      - path: ../../shared/plan-period-vectors.json
        buildPhase: resources
      - path: ../../shared/shopping-vectors.json
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: '5.10'
        GENERATE_INFOPLIST_FILE: 'YES'

schemes:
  Stock:
    build:
      targets:
        Stock: all
        StockTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StockTests

  # The domain tests, without the app.
  #
  # `StockTests` already compiles Stock/Domain directly rather than depending on
  # the app target, so the vectors never wait for a Firebase download. The Stock
  # scheme undoes half of that: it embeds the watch app, so `xcodebuild test`
  # refuses to run at all without a watchOS runtime installed ("watchOS 26.5
  # must be installed in order to test the scheme") — a calendar-arithmetic test
  # blocked on a simulator runtime for a different platform.
  #
  # Use this one for the test loop; use Stock to run the app.
  StockTests:
    build:
      targets:
        StockTests: [test]
    test:
      config: Debug
      targets:
        - StockTests
