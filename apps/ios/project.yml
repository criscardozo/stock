name: Stock
options:
  bundleIdPrefix: dev.cardozo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    # Cristian's free personal team, the same one Gastos Diarios uses. Baked in
    # so xcodegen persists it and Xcode stops rewriting the generated project on
    # every open. Free team = 7-day signing, which is the $0 distribution path
    # until the Apple Developer Program decision (PLAN Phase 5).
    DEVELOPMENT_TEAM: FA737M2U79

packages:
  # 12.x verified against the emulator on 2026-09-03, because the Gastos Diarios
  # session had to revert this exact bump: on 12.18.0 two of its screens hung on
  # "Cargando…".
  #
  # WHAT WAS CHECKED HERE, on an erased simulator against a fresh seed: all four
  # tabs render server data (the Hoy tab is what exercises the plan listener),
  # four gRPC connections stay ESTABLISHED across several minutes with nothing
  # degrading, and firebase-debug.log — which demonstrably records listener
  # activity, so its silence means something — carries no GOAWAY. Auth was
  # proven server-side rather than from the screen: the emulator's lastLoginAt
  # for the seeded user lands two seconds AFTER launch, so it is a real session
  # and not one restored from the simulator keychain.
  #
  # WHAT IS NOT KNOWN is why it broke for them, and an earlier version of this
  # comment claimed to: it said the keepalive policy objects to per-screen
  # listener churn, which Stock avoids by keeping all six in one long-lived
  # Store. Their own timeline killed that — the GOAWAY was stamped before any
  # per-screen store had opened anything, and they later reproduced the hang
  # with no GOAWAY at all. It was a plausible story written where a measurement
  # belongs.
  #
  # What actually correlates on their side is their in-app DevSeed deleting and
  # recreating documents at launch, in the collections those screens then
  # listen to. Stock does none of that: `Seeds.load()` runs only inside
  # createHousehold, every delete in the app is a user action, and the emulator
  # seed is a separate Node script that finishes before the app starts.
  #
  # So the bump may well be fine for them too. Their revert is caution about an
  # unexplained failure, not evidence against this pin.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

targets:
  Stock:
    type: application
    platform: iOS
    sources:
      - path: Stock
      # The seed data the web writes too. XcodeGen puts resources in `sources`
      # with an explicit buildPhase; a folder reference would nest them under
      # shared/ inside the bundle, where Bundle.url(forResource:) can't see them.
      - path: ../../shared/categories.json
        buildPhase: resources
      - path: ../../shared/locations.json
        buildPhase: resources
      - path: ../../shared/units.json
        buildPhase: resources
    info:
      path: Stock/Info.plist
      properties:
        CFBundleDisplayName: Stock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Same face as the web, so the two apps read as one family.
        UIAppFonts:
          - Outfit-Variable.ttf
        # The scanner is the only hardware this app asks for, and the string
        # says what it does with it.
        NSCameraUsageDescription: Para escanear el código de barras de un producto y cargarlo sin tipear.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleURLSchemes:
              - stock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.stock
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        # The bag mark from the design bundle, in the three appearances iOS 18
        # asks for: light, dark, and the tinted monochrome the system recolours.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Must match REVERSED_CLIENT_ID in GoogleService-Info.plist: it is the
        # URL scheme Google calls back on, and a mismatch means the sign-in
        # leaves and never returns.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.176221729478-irdlooa4ls67ocn58vm5o0crvmkdtu2p
    entitlements:
      path: Stock/Stock.entitlements
      properties:
        # The only thing this buys: a defaults suite the widget can read. The
        # widget cannot sign in — an extension has no browser — so the app is
        # its only source of data.
        com.apple.security.application-groups:
          - group.dev.cardozo.stock
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: StockWidget
      # Embeds the watch app so it installs alongside the phone app.
      - target: StockWatch
        embed: true

  # Tonight's dinner on the home screen — the piece of Phase 4 that was named
  # and never built.
  #
  # Like the watch app it cannot sign in and therefore never talks to Firebase:
  # it reads a snapshot the app leaves in the shared app-group defaults. That is
  # why the snapshot carries the DATE it describes — a widget goes on rendering
  # long after the app last ran, and a stale one does not look stale.
  #
  # A third target is a THIRD provisioning profile. `pnpm install:ios`
  # already sweeps `PlugIns/*.appex` and `SigningExpiry` already reads every
  # profile in the bundle, so neither needs changing — but the install should
  # now report three, sharing one expiry.
  StockWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StockWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.stock.widget
        PRODUCT_NAME: StockWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        SWIFT_VERSION: "5.10"
    info:
      path: StockWidget/Info.plist
      properties:
        CFBundleDisplayName: Stock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StockWidget/StockWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.cardozo.stock

  # watchOS companion — the shopping list on the wrist, which is the one place
  # the phone is genuinely in the way: both hands are on the trolley.
  #
  # It CANNOT sign in (Google needs a browser and a watch has none), so it never
  # talks to Firebase. The phone pushes a flattened snapshot over
  # WatchConnectivity and performs every write. No Firebase dependency here on
  # purpose — see Stock/Data/WatchSync.swift.
  StockWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - path: StockWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.stock.watchkitapp
        PRODUCT_NAME: StockWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.10"
    info:
      path: StockWatch/Info.plist
      properties:
        CFBundleDisplayName: Stock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # Ties the two together: this is what makes the watch app install with
        # the phone app instead of as a stranger.
        WKCompanionAppBundleIdentifier: dev.cardozo.stock

  # Domain tests compile the pure-logic files directly instead of depending on
  # the app target: the shared vectors don't need Firebase, and making them wait
  # for an SDK download to prove that calendar arithmetic works would be silly.
  StockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StockTests
      - path: Stock/Domain
      # Pure Foundation despite living in Data/ — no Firebase, so the tests can
      # compile it without waiting for an SDK.
      - path: Stock/Data/SigningExpiry.swift
      # Both halves of the widget handoff, so the mirror can be checked against
      # the original. Two structs kept in sync BY HAND is exactly the thing that
      # drifts without anything failing.
      - path: Stock/Data/WidgetBridge.swift
      # The Open Food Facts client, for `classify` — which is what decides
      # whether a barcode is unknown or the phone simply could not ask.
      - path: Stock/Data/OpenFoodFacts.swift
      - path: StockWidget/MealSnapshot.swift
      # The font itself, as a test resource. A test bundle has no UIAppFonts,
      # so FontLoadingTests registers it at runtime and then asserts that the
      # name AppFont asks for actually resolves — which is exactly what was
      # wrong, unnoticed, for as long as the file has been in the app.
      # The rules themselves, so FieldLimitsTests can read the numbers rather
      # than repeat them. The web does the same from parity.test.ts.
      - path: ../../firebase/firestore.rules
        buildPhase: resources
      - path: Stock/Resources/Fonts/Outfit-Variable.ttf
        buildPhase: resources
      # SwiftUI and UIKit only. Compiled in so the symbol map can be checked
      # against what SF Symbols actually ships.
      - path: Stock/Design/Theme.swift
      - path: ../../shared/categories.json
        buildPhase: resources
      - path: ../../shared/locations.json
        buildPhase: resources
      - path: ../../shared/plan-period-vectors.json
        buildPhase: resources
      - path: ../../shared/shopping-vectors.json
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Stock:
    build:
      targets:
        Stock: all
        StockTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StockTests

  # The domain tests, without the app.
  #
  # `StockTests` already compiles Stock/Domain directly rather than depending on
  # the app target, so the vectors never wait for a Firebase download. The Stock
  # scheme undoes half of that: it embeds the watch app, so `xcodebuild test`
  # refuses to run at all without a watchOS runtime installed ("watchOS 26.5
  # must be installed in order to test the scheme") — a calendar-arithmetic test
  # blocked on a simulator runtime for a different platform.
  #
  # Use this one for the test loop; use Stock to run the app.
  StockTests:
    build:
      targets:
        StockTests: [test]
    test:
      config: Debug
      targets:
        - StockTests
