packages:
  - "apps/web"
  - "firebase/rules-tests"
  - "tools"

# Single-sourced versions for anything BOTH workspaces use. They had drifted
# apart on their own — web was on TypeScript 5.9 and @types/node 20 while
# rules-tests was on 7.0.2 and 26 — which meant the rules tests were being
# typechecked by a different compiler than the app. A catalog makes that
# impossible rather than merely discouraged, and keeps the versions matched with
# Gastos Diarios, which shares this stack.
catalog:
  # 5.9 and not 7.x on purpose: TypeScript 7 is the native port and still has
  # gaps. Agreed with the Gastos Diarios side, which stays on 5.9 too.
  typescript: ^5.9.3
  # 24 and not 26: it is the LTS line, and nothing here needs newer typings.
  "@types/node": ^24.13.4
  firebase: ^12.19.0
  # Also in two places until now, at two different versions (5.0.1 in tools,
  # 5.0.2 in rules-tests). It is what the rules tests assert THROUGH, so a
  # seed written by one version and rules exercised by another is a
  # difference nothing would have reported.
  "@firebase/rules-unit-testing": ^5.0.2
  vitest: ^5.0.1

# Native/postinstall builds we explicitly trust. re2 is what firebase-tools uses
# to evaluate the regexes in firestore.rules, so it has to actually build.
allowBuilds:
  '@firebase/util': true
  protobufjs: true
  re2: true
  sharp: false
  unrs-resolver: false

# Transitive fixes the package that pulls them has not shipped yet.
#
# fast-uri < 3.1.6 carries four HIGH advisories (host confusion and SSRF via
# skipped IDN and percent-encoded checks). It arrives through
# firebase-tools → @modelcontextprotocol/sdk → ajv, so it is dev-only and never
# runs in the app — but four highs in `pnpm audit` are noise that hides the next
# real one. Remove when firebase-tools ships a tree without it.
overrides:
  fast-uri: '>=3.1.6'
