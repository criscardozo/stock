version: 2
updates:
  # JS workspace (web + rules-tests + root tooling)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A caret range like `^24.13.3` already admits `24.13.4`, so bumping the
    # DECLARED range for a patch that already fits changes nothing the
    # lockfile could not do on its own — it just drags a PR through review for
    # no different install. `increase-if-necessary` leaves the requirement
    # alone when the new release already satisfies it (the lockfile still gets
    # the resolved bump) and only widens it when it does not. See
    # kyber/docs/versiones.md § "Cuando una dependencia declarada se mueve".
    versioning-strategy: increase-if-necessary
    groups:
      # One PR for the routine churn.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Majors are opt-in. Framework/toolchain jumps (Next, React, TypeScript,
      # ESLint, @types/node) either break the build or need a manual migration
      # — e.g. TypeScript 7 breaks Next's config loader. Bump those by hand.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # CI action versions — majors here are low-risk and worth taking; grouped
  # into a single PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  # NO hay bloque `swift` acá, y no es un olvido. Dependabot lee
  # `Package.resolved`, que en este repo vive dentro de `Stock.xcodeproj/` —
  # generado por XcodeGen desde `project.yml` y gitignoreado, así que no hay
  # nada que Dependabot pueda leer. Las versiones de los SDK de Swift son los
  # rangos `from:` de `project.yml` y se suben a mano, verificando que la app
  # CORRA (ver el comentario al lado del pin de Firebase: compilar no alcanza
  # para un SDK que maneja auth y todos los listeners).
  #
  # Gastos Diarios sí lo tiene y allá funciona, porque trackea su xcodeproj.
