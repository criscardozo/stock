version: 2
updates:
  # JS workspace (web + rules-tests + root tooling)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A caret range like `^24.13.3` already admits `24.13.4`, so bumping the
    # DECLARED range for a patch that already fits changes nothing the
    # lockfile could not do on its own — it just drags a PR through review for
    # no different install. `increase-if-necessary` leaves the requirement
    # alone when the new release already satisfies it (the lockfile still gets
    # the resolved bump) and only widens it when it does not. See
    # kyber/docs/versiones.md § "Cuando una dependencia declarada se mueve".
    versioning-strategy: increase-if-necessary
    groups:
      # One PR for the routine churn.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Majors are opt-in. Framework/toolchain jumps (Next, React, TypeScript,
      # ESLint, @types/node) either break the build or need a manual migration
      # — e.g. TypeScript 7 breaks Next's config loader. Bump those by hand.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # CI action versions — majors here are low-risk and worth taking; grouped
  # into a single PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  # NO hay bloque `swift` acá, y ya NO es porque sea imposible. La razón
  # original —«Package.resolved vive dentro del xcodeproj gitignoreado, así que
  # no hay nada que Dependabot pueda leer»— dejó de ser cierta el 21/09/2026,
  # cuando ese archivo pasó a trackearse (5c5cb36). Hoy el bloque funcionaría.
  #
  # Queda como decisión pendiente, no como imposibilidad, y lo que la decide es
  # el costo de verificar: un PR de un SDK de Swift NO se puede verificar en
  # CI —no hay runner de macOS ni lo va a haber— así que cada uno cuesta un
  # build local y una corrida en el teléfono. Y no alcanza con que compile: el
  # pin de Firebase tiene al lado el comentario de por qué un SDK que maneja
  # auth y todos los listeners hay que verlo CORRER.
  #
  # Medido antes de escribir esto, y separa dos cosas que se confunden:
  #   - actualizaciones: Gastos tiene el bloque y le produjo 6 PRs reales, o
  #     sea que el mecanismo anda sobre esta misma forma de proyecto;
  #   - alertas de vulnerabilidad: NO las compra. El grafo de dependencias de
  #     Gastos lista siete manifiestos y ninguno es Swift, y sus alertas son
  #     todas de npm. Trackear el Package.resolved no cambia eso.
  #
  # Así que los 16 paquetes que se compilan dentro del binario del teléfono
  # siguen sin nadie que los mire por vulnerabilidades, con bloque o sin él.
  # Mientras el bloque no esté, las versiones se suben a mano desde los rangos
  # `from:` de `project.yml`.
