version: 2
updates:
  # JS workspace (web + rules-tests + root tooling)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A caret range like `^24.13.3` already admits `24.13.4`, so bumping the
    # DECLARED range for a patch that already fits changes nothing the
    # lockfile could not do on its own — it just drags a PR through review for
    # no different install. `increase-if-necessary` leaves the requirement
    # alone when the new release already satisfies it (the lockfile still gets
    # the resolved bump) and only widens it when it does not. See
    # kyber/docs/versiones.md § "Cuando una dependencia declarada se mueve".
    versioning-strategy: increase-if-necessary
    groups:
      # One PR for the routine churn.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Majors are opt-in. Framework/toolchain jumps (Next, React, TypeScript,
      # ESLint, @types/node) either break the build or need a manual migration
      # — e.g. TypeScript 7 breaks Next's config loader. Bump those by hand.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # CI action versions — majors here are low-risk and worth taking; grouped
  # into a single PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  # Swift — decidido por Cristian el 25/09/2026.
  #
  # Es posible desde que `Package.resolved` se trackea (21/09, 5c5cb36): antes
  # vivía adentro del xcodeproj ignorado y no había nada que leer. La otra app
  # tiene este mismo bloque sobre la misma forma de proyecto y le produjo PRs
  # reales, así que el mecanismo está probado.
  #
  # Lo que cuesta, y por qué se aceptó con eso a la vista: un PR de un SDK de
  # Swift NO se verifica en CI —no hay runner de macOS ni lo va a haber—, así que
  # cada uno pide un build local y una corrida en el teléfono. Y no alcanza con
  # que compile: Firebase maneja auth y todos los listeners, y hay que verlo
  # CORRER. El límite de 3 PRs abiertos y el agrupado de minor/patch existen para
  # que ese costo llegue de a uno y no en avalancha.
  #
  # Lo que este bloque NO compra: alertas de vulnerabilidad. El grafo de
  # dependencias no lee `Package.resolved` adentro de un `.xcodeproj` —medido en
  # la otra app, que lo trackea y cuyo grafo no lista un solo paquete Swift—.
  # Los 16 paquetes del binario siguen sin nadie que los mire por eso. Este
  # bloque trae actualizaciones; no trae avisos.
  - package-ecosystem: swift
    directory: "/apps/ios"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      swift-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Firebase fija GTMSessionFetcher, GTMAppAuth y GoogleAds de forma
      # transitiva; subirles el major por separado rompe el grafo resuelto. Que
      # el major del SDK de Firebase los arrastre.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Analytics y Ads, que esta app no linkea: usa FirebaseAuth y
      # FirebaseFirestore y nada más (verificado en `project.yml`). Están en
      # `Package.resolved` porque el paquete de Firebase los DECLARA para
      # FirebaseAnalytics, que no se incluye, así que un PR que los suba no mueve
      # nada que corra. Verificado también que los dos aparecen en el resolved de
      # esta app antes de listarlos.
      #
      # Con el nombre como lo escribe el ecosistema Swift —host y ruta, no el
      # nombre corto—, y las dos grafías de GoogleAppMeasurement. La otra app lo
      # aprendió cuando Dependabot no matcheó los nombres cortos y reabrió el mismo
      # PR a los minutos de entrar la config; estos nombres vienen de ahí.
      - dependency-name: "github.com/googleads/google-ads-on-device-conversion-ios-sdk"
      - dependency-name: "github.com/google/googleappmeasurement"
      - dependency-name: "github.com/google/GoogleAppMeasurement"
