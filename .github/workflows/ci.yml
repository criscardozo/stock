name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two pushes a minute apart used to run twice, so the older run is cancelled
# rather than raced. Worth doing whatever the allowance is: a superseded run
# tells you about a commit nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ubuntu only, and this is the one place that says why. The other three that
# used to say it in their own words now point here — same fact, four wordings,
# and no grep could ever have found all four.
#
# THERE IS NO iOS JOB HERE AND NO iOS WORKFLOW ANYWHERE, and that is a
# decision, not only a bill. The bill: a PRIVATE repo bills macOS runners at a
# 10x minute multiplier against one monthly allowance shared with Gastos
# Diarios, and a single iOS job eats it in an afternoon. The decision: iOS is
# built, tested on a simulator and sideloaded from the machine where the phone
# is, before each change lands (CLAUDE.md has the xcodebuild line) — that is
# where an Apple toolchain belongs for this project, and it is where the
# signing identity and the device live.
#
# Written this way on purpose, because the bill EXPIRES and the decision does
# not. The day this repo becomes public the multiplier stops applying to it,
# and none of the sentences above become false: the reason to keep iOS local
# is still there, and adding a macOS job would still be a change worth asking
# about rather than a free lunch. The alternative was to write it as "this
# repo is private, so ..." and leave somebody to edit four files on the day
# somebody flips a switch — which is the shape that quietly goes stale,
# because the edit depends on remembering at the exact moment nobody does.
#
# Vercel already builds every push, so `build` here is not about the deploy: it
# is about catching a broken build on a PR before it becomes a red deploy.

jobs:
  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    # A hung emulator or a stuck browser would otherwise burn to the 6-hour
    # default, out of the same shared allowance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # kyber is a public submodule, so this needs no credential and brings
          # the exact commit the gitlink points at. It replaced a second
          # checkout with a read-only deploy key, from when kyber was private.
          submodules: true
          # Without this the checkout arrives with no tags at all, and the guard
          # that asks whether the declared version is tagged cannot tell "this
          # one is missing" from "there are none here" — it would go red on
          # every release commit for the wrong reason.
          fetch-tags: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck before lint: a type error explains a lint failure, and this
      # way the log leads with the cause instead of the symptom.
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      # Includes the shared-vector tests, which are the contract with the Swift
      # side. A vector added here and not implemented there fails locally on
      # iOS, not in CI — that asymmetry follows from there being no iOS job,
      # and it is why the vectors are committed before either implementation.
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      # globals.css, Theme.swift and WatchTheme.swift are GENERATED from
      # design-system/tokens.json (design-system/emit.py). Regenerating must be
      # a no-op: if it is not, someone edited a token by hand in one of the
      # platforms instead of in tokens.json, which is exactly how Gastos
      # Diarios' dark warning text ended up under the AA contrast floor on the
      # web only, for months, with nothing to catch it. Stronger than comparing
      # text against a stored copy — it proves the files can be REBUILT, not
      # merely that they currently match. Ubuntu-only: no iOS toolchain needed
      # to rewrite a string.
      - name: Design tokens rebuild unchanged
        run: |
          python3 design-system/emit.py --write
          git diff --exit-code apps/web/src/app/globals.css apps/ios/Stock/Design/Theme.swift apps/ios/StockWatch/WatchTheme.swift
      # The PWA is how this app stays on the phone without Apple signing, so
      # "does it still start with no network" is a release-blocking question.
      # It needs the PRODUCTION build above — `next dev` does not serve the
      # service worker — which is why it lives in this job and not the E2E one.
      # ~95 MB of Chromium, downloaded twice per run without this. Keyed on the
      # lockfile because that is what pins @playwright/test, and the browser
      # build has to match it.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: PWA still installs and starts offline
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web exec next start -p 3113 &
          npx wait-on http://localhost:3113/stock --timeout 120000
          pnpm --filter web verify:pwa

  e2e:
    name: Web — Playwright E2E (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # ~95 MB of Chromium, downloaded twice per run without this. Keyed on the
      # lockfile because that is what pins @playwright/test, and the browser
      # build has to match it.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Emulators and seed are started here rather than by Playwright's
      # webServer: the suite needs BOTH, and starting them together would hide
      # which of the two failed.
      - name: Start Firebase emulators
        run: |
          ./node_modules/.bin/firebase emulators:start --only auth,firestore \
            --config firebase/firebase.json --project demo-stock &
          npx wait-on tcp:9280 tcp:8280 --timeout 120000
      - run: pnpm seed
      - run: pnpm --filter web test:e2e

  rules:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # kyber is a public submodule, so this needs no credential and brings
          # the exact commit the gitlink points at. It replaced a second
          # checkout with a read-only deploy key, from when kyber was private.
          submodules: true
          # Without this the checkout arrives with no tags at all, and the guard
          # that asks whether the declared version is tagged cannot tell "this
          # one is missing" from "there are none here" — it would go red on
          # every release commit for the wrong reason.
          fetch-tags: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # firebase-tools 15 dropped the older JDKs and refuses to start rather
      # than warning, so the version here is not incidental.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # Spins up its own emulator via `emulators:exec` — nothing to wait on.
      # These rules are the only security boundary the project has, so this job
      # is the one that must never be skipped.
      - run: pnpm --filter rules-tests test
