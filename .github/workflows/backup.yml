name: Backup

# Weekly Firestore backup. Firestore's managed export needs the Blaze plan, so
# the $0 path is the Admin SDK dump shared with the other apps
# (kyber/scripts/backup.mjs), run somewhere that is always on — which a laptop
# is not. GitHub Actions is that somewhere: a scheduled run costs a couple of
# the 2,000 free minutes a month, and the dump is kept as a build artifact.
#
# ── Gap on purpose, 16/09/2026 to 01/10/2026 ──
#
# That "couple of minutes" assumes there are minutes. On 15/09/2026 the account
# hit the 2,000 — 2382 used, almost all of it by a sibling repo — and with a $0
# budget and stop-usage set, Actions simply stops: jobs start and finish in two
# seconds having run zero steps. So THIS WORKFLOW DID NOT RUN on 16/09, and
# will not on 23/09 or 30/09. The cycle resets on 01/10 and it resumes by
# itself; nothing here needs changing.
#
# Cristian's call, asked directly with the numbers: leave the window uncovered.
# Two manual production dumps were taken by hand (15/09 and 16/09, 41 items and
# 2 mealPlans each, `format: 1`, `source: production`) and the household is two
# people whose data moves slowly. The alternative on the table was a local
# scheduled job, and the cost of that is a piece of machine state somebody has
# to remember to remove on 01/10 or it duplicates this cron.
#
# Written down because an accepted gap and an unnoticed one look identical in a
# month. The risk being accepted, named: an accidental deletion inside those
# fifteen days has no automatic restore point newer than 16/09. To take one by
# hand meanwhile:
#   GOOGLE_APPLICATION_CREDENTIALS=firebase/service-account.json \
#     node kyber/scripts/backup.mjs

on:
  schedule:
    # Thursday morning in Sydney, year-round: 20:00 UTC Wednesday is 06:00
    # Thursday at +10 (AEST) and 07:00 at +11 (AEDT). GitHub cron is UTC and
    # has no timezone, so the offset is baked in here rather than drifting.
    - cron: "0 20 * * 3"
  # Also runnable on demand: Actions tab → Backup → Run workflow, or
  # `gh workflow run Backup`.
  workflow_dispatch:

# One backup at a time. A run queued behind another has nothing new to say.
concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    name: Dump Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # kyber is a public submodule, so this needs no credential and brings
          # the exact commit the gitlink points at. It replaced a second
          # checkout with a read-only deploy key, from when kyber was private.
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write the service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. Add the backup service-account JSON as a repository secret (see docs/setup.md)."
            exit 1
          fi
          # Outside the workspace on purpose, so no step can commit or upload
          # it by accident. The runner is thrown away either way.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

      - name: Back up
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: pnpm backup

      # The rules are the ONLY security boundary in this project, and they are
      # deployed by hand. A fix that was written, reviewed, merged and never
      # deployed reads as done in every place anyone would look, so once a week
      # something asks Firestore what it is actually enforcing. Free: same
      # runner, same credential, two GETs. A mismatch FAILS the job, which is
      # what sends the email.
      - name: Deployed rules still match the repo
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: node kyber/scripts/check-rules-drift.mjs

      - name: Stamp the artifact
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: firestore-backup-${{ steps.stamp.outputs.date }}
          path: backups/*.json
          # The ceiling on a free private repo. Roughly the last three months
          # of Thursdays are downloadable at any time.
          retention-days: 90
          if-no-files-found: error

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
